<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare — NYC Hazard Historian</title>
<meta name="description" content="Put up to four New York City hazard events side by side across weather, consequences, damage and federal assistance.">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<a class="skip" href="#main-content">Skip to the comparison</a>

<header data-chrome="masthead"></header>

<main id="main-content">
  <section class="wrap console">
    <h1 class="console-h1">Compare events</h1>
    <p class="console-sub">Measures down the side, events across the top. A
    comparison is a link, so it can be sent to someone else exactly as it
    stands.</p>

    <ul class="chips" id="picked" aria-label="Events in this comparison" style="margin-top:0"></ul>
    <p class="val-note" id="picked-note"></p>
    <div class="actions">
      <a class="btn btn-quiet btn-small" href="explore.html">Add events from the explorer</a>
      <button type="button" class="btn btn-quiet btn-small" id="copy">Copy link to this comparison</button>
    </div>
  </section>

  <section class="wrap">
    <p class="loading" id="loading">Loading the events.</p>
    <div id="sheet"></div>
  </section>
</main>

<footer data-chrome="footer"></footer>

<script src="js/format.js"></script>
<script src="js/site.js"></script>
<script src="js/compare.js"></script>
</body>
</html>
